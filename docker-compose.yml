# Docker Compose stack that reproduces the real-node scenario end to end:
# an anvil node, a one-shot token deployment and mint, a facilitator, a
# redpanda broker, and the x402 gateway. `docker compose up` brings up
# anvil + init + facilitator + redpanda + gateway; `docker compose run --rm
# agent` performs a payment, which the gateway journals and publishes.
#
# The gateway runs in remote mode: it delegates verification and settlement to
# the facilitator and holds neither an RPC connection nor a key. The settlement
# key lives on the facilitator. This is the "resource server does not touch the
# chain" split from the x402 spec, made concrete in the stack topology.
#
# The keys below are the publicly known anvil development accounts (#0, #1, #2).
# They are shipped for local testing only and never hold real funds.

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    # The foundry image entrypoint is `sh -c`, so the command is one string.
    command: ["anvil --host 0.0.0.0"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 2s
      timeout: 4s
      retries: 20

  # One-shot: deploy the token, mint to the agent, publish the address.
  init:
    build: .
    image: stablecoin-x402-gateway:local
    depends_on:
      anvil:
        condition: service_healthy
    environment:
      RPC_URL: http://anvil:8545
      ISSUER_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80" # anvil key #0
      AGENT_ADDRESS: "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC" # anvil account #2 address
    entrypoint: ["entrypoint-init.sh"]
    volumes:
      - shared:/shared
    restart: "no"

  # Verifies and settles payments on-chain; holds the settlement key and pays gas.
  facilitator:
    image: stablecoin-x402-gateway:local
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      RPC_URL: http://anvil:8545
      FACILITATOR_KEY: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d" # anvil key #1
    entrypoint: ["entrypoint-facilitator.sh"]
    volumes:
      - shared:/shared

  # Kafka-API-compatible broker in a single container (no ZooKeeper), which
  # suits the demo stack. Kafka API compatible; swap in a Kafka cluster in
  # production. The gateway's outbox publishes settlement events here.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Remote mode: no RPC, no key. Delegates verify/settle to the facilitator.
  # It journals settlements to the shared volume and publishes them to redpanda.
  gateway:
    image: stablecoin-x402-gateway:local
    depends_on:
      init:
        condition: service_completed_successfully
      facilitator:
        condition: service_started
      redpanda:
        condition: service_healthy
    environment:
      FACILITATOR_URL: http://facilitator:8403
      NETWORK: eip155:31337 # anvil default chain id
      PAYTO: "0x90F79bf6EB2c4f870365E785982E1f101E93b906" # anvil account #3 (payment recipient)
      JOURNAL_PATH: /shared/settlements.jsonl
      KAFKA_BROKERS: redpanda:9092
    entrypoint: ["entrypoint-gateway.sh"]
    ports:
      - "8402:8402"
    volumes:
      - shared:/shared

  # Not started by `up` (demo profile); run it on demand to pay once.
  agent:
    image: stablecoin-x402-gateway:local
    profiles: ["demo"]
    depends_on:
      gateway:
        condition: service_started
    environment:
      RPC_URL: http://anvil:8545
      AGENT_KEY: "0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a" # anvil key #2
    entrypoint: ["entrypoint-agent.sh"]
    volumes:
      - shared:/shared

volumes:
  shared:
